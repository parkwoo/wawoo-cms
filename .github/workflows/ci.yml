name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, openssl

      - name: Install PHPUnit 9.6 (no composer runtime)
        run: |
          curl -fsSL -o /usr/local/bin/phpunit \
            https://phar.phpunit.de/phpunit-9.6.phar
          chmod +x /usr/local/bin/phpunit
          phpunit --version

      - name: Lint
        run: |
          err=0
          while IFS= read -r f; do php -l "$f" >/dev/null || err=1; done < <(find . -name '*.php' ! -path './vendor/*')
          exit $err

      - name: Run test suite
        run: phpunit --colors=never
