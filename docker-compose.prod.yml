# Example production override.
# Copy to docker-compose.override.yml or pass with -f.
#
# Root filesystem is read-only, but the CMS admin console (posts publish/
# delete, plugin/theme state, contact inbox, comments) writes to disk. Those
# stateful paths must be mounted as persistent named volumes — see volumes
# below. Snapshot/back up these volumes (wawoo_posts, wawoo_pages,
# wawoo_uploads, wawoo_state) together; they are the site's source of truth.
#
# To update the app image you only replace the image tag; content lives in
# the volumes.
services:
  wawoo:
    image: ghcr.io/your-org/wawoo-cms:1.0.0
    ports:
      - "127.0.0.1:8080:80"  # bind to localhost only; proxy in front
    environment:
      WAWOO_ENV: production
      TZ: Asia/Tokyo
      # When a TLS-terminating reverse proxy fronts this container, PHP must
      # only send the session cookie over HTTPS. Either pass the real scheme
      # through (proxy_set_header X-Forwarded-Proto https) or force it here.
      PHP_VALUE: "session.cookie_secure=1"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - wawoo_posts:/var/www/html/posts        # markdown bundles (editable)
      - wawoo_pages:/var/www/html/pages        # fixed pages
      - wawoo_uploads:/var/www/html/uploads    # uploaded media
      - wawoo_state:/var/www/html/cache        # plugin/theme state, contact
                                               # inbox, comments, caches
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # One-shot chown so the Apache worker (www-data) can write the named
  # volumes. Runs before the main service on first deploy.
  init-volumes:
    image: ghcr.io/your-org/wawoo-cms:1.0.0
    user: root
    volumes:
      - wawoo_posts:/var/www/html/posts
      - wawoo_pages:/var/www/html/pages
      - wawoo_uploads:/var/www/html/uploads
      - wawoo_state:/var/www/html/cache
    entrypoint:
      - /bin/sh
      - -c
      - chown -R www-data:www-data /var/www/html/posts /var/www/html/pages /var/www/html/uploads /var/www/html/cache

volumes:
  wawoo_posts:
  wawoo_pages:
  wawoo_uploads:
  wawoo_state:
