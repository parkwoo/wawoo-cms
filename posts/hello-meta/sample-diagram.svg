<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">wawoo-cms architecture sample</title>
  <desc id="d">Simple layered diagram of posts, core and plugins.</desc>
  <rect width="800" height="420" fill="#f6f8fa" rx="18"/>
  <g font-family="system-ui, sans-serif">
    <rect x="60" y="40" width="680" height="70" rx="12" fill="#0969da"/>
    <text x="400" y="84" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">posts/*.md</text>
    <line x1="400" y1="120" x2="400" y2="160" stroke="#57606a" stroke-width="4"/>
    <rect x="60" y="160" width="680" height="70" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="400" y="204" text-anchor="middle" fill="#1f2328" font-size="24" font-weight="700">includes/core (bootstrap · hooks · markdown)</text>
    <line x1="400" y1="240" x2="400" y2="280" stroke="#57606a" stroke-width="4"/>
    <rect x="60" y="280" width="680" height="70" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="400" y="324" text-anchor="middle" fill="#1a7f37" font-size="24" font-weight="700">themes/ + plugins/ (seo · comments · i18n · …)</text>
  </g>
</svg>
